<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSK1 教学参考 · Teacher's Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Noto+Serif:wght@400;500&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="词表">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 7h16M4 12h11M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
  </button>
  <a class="brand" href="#/">
    <span class="seal">教</span>
    <span class="brand-txt"><b>HSK1 教学参考</b><small>HSK 3.0 · Level 1 · Teacher's Reference</small></span>
  </a>
  <div class="search" id="searchBox">
    <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" fill="none"/><path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="搜索：汉字 / pinyin / English　例：包子、baozi、cup" aria-label="搜索词汇">
    <kbd>/</kbd>
    <div class="results" id="results" hidden></div>
  </div>
  <div class="progress" id="progress"></div>
</header>

<div class="shell">
  <aside class="side" id="side">
    <div class="side-head">
      <h2>词汇表</h2>
      <div class="seg" id="listFilter">
        <button data-f="all" class="on">全部</button>
        <button data-f="done">已完成</button>
      </div>
    </div>
    <nav class="wordlist" id="wordlist"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main id="main" tabindex="-1"></main>
</div>

<div class="toast" id="toast" hidden></div>
